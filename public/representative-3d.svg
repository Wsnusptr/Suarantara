<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 500" width="400" height="500">
  <defs>
    <linearGradient id="bodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1B2D5E"/>
      <stop offset="100%" stop-color="#0E1930"/>
    </linearGradient>
    <linearGradient id="goldAcc" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5DF80"/>
      <stop offset="100%" stop-color="#D4A200"/>
    </linearGradient>
    <linearGradient id="skinGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F5D0A9"/>
      <stop offset="100%" stop-color="#D8A06E"/>
    </linearGradient>
    <filter id="shadow3D" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="15" flood-color="#0E1930" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Person Figure with 3D Pop Out Effect -->
  <g filter="url(#shadow3D)">
    <!-- Shoulders & Almamater Blazer -->
    <path d="M70 490 L110 320 C130 300 270 300 290 320 L330 490 Z" fill="url(#bodyGrad)"/>
    
    <!-- White Shirt Collar -->
    <polygon points="175,270 200,340 225,270 200,290" fill="#FFFFFF"/>
    <!-- Navy Tie -->
    <polygon points="195,290 205,290 208,360 200,380 192,360" fill="#C0392B"/>
    <circle cx="200" cy="290" r="6" fill="#C0392B"/>

    <!-- Blazer Lapels with Gold Pin -->
    <path d="M140 320 L185 430 L200 480 L160 490 Z" fill="#152347"/>
    <path d="M260 320 L215 430 L200 480 L240 490 Z" fill="#152347"/>
    <!-- Gold Organization Pin on Chest -->
    <circle cx="160" cy="360" r="7" fill="url(#goldAcc)"/>
    <circle cx="160" cy="360" r="5" fill="#1B2D5E"/>

    <!-- Neck -->
    <rect x="180" y="240" width="40" height="40" rx="6" fill="url(#skinGrad)"/>
    
    <!-- Head -->
    <ellipse cx="200" cy="180" rx="48" ry="60" fill="url(#skinGrad)"/>
    
    <!-- Hair Modern / Classic -->
    <path d="M145 170 C140 120 170 100 200 100 C235 100 260 120 255 170 C250 140 230 115 200 115 C170 115 150 140 145 170 Z" fill="#222226"/>
    <path d="M148 165 C150 135 170 120 200 120 C230 120 248 135 252 165 C240 150 220 145 200 145 C180 145 160 150 148 165 Z" fill="#111113"/>

    <!-- Ears -->
    <ellipse cx="150" cy="185" rx="7" ry="14" fill="#D8A06E"/>
    <ellipse cx="250" cy="185" rx="7" ry="14" fill="#D8A06E"/>

    <!-- Face Silhouette Features -->
    <!-- Eyes -->
    <ellipse cx="182" cy="175" rx="4" ry="2.5" fill="#333"/>
    <ellipse cx="218" cy="175" rx="4" ry="2.5" fill="#333"/>
    <!-- Eyebrows -->
    <path d="M174 165 Q184 161 192 165" stroke="#333" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <path d="M208 165 Q216 161 226 165" stroke="#333" stroke-width="2.5" stroke-linecap="round" fill="none"/>
    <!-- Nose -->
    <path d="M200 175 L197 195 L203 195" stroke="#C88E5E" stroke-width="2" stroke-linecap="round" fill="none"/>
    <!-- Smile -->
    <path d="M188 212 Q200 222 212 212" stroke="#B87348" stroke-width="2.5" stroke-linecap="round" fill="none"/>

    <!-- Document / Folder in Hand -->
    <g transform="rotate(-12 120 420)">
      <rect x="80" y="380" width="90" height="110" rx="6" fill="#F4F1EA" stroke="#1B2D5E" stroke-width="2"/>
      <rect x="90" y="395" width="50" height="5" rx="2" fill="url(#goldAcc)"/>
      <rect x="90" y="410" width="70" height="3" rx="1.5" fill="#999"/>
      <rect x="90" y="420" width="65" height="3" rx="1.5" fill="#999"/>
      <rect x="90" y="430" width="60" height="3" rx="1.5" fill="#999"/>
    </g>
  </g>
</svg>
